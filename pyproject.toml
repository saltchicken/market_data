[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market_data"
version = "0.1.0"
description = "Extract market data from polygon and calculate technical indicators"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "polygon-api-client", 
    "python-dotenv",
    "numpy",
    "pandas",
    "sqlalchemy",
    "psycopg2-binary",
    "tqdm",
]

[project.scripts]
market_data = "market_data.__main__:main"
market_query = "market_data.query_runner:main"

[tool.setuptools.package-data]
"market_data" = ["sql/*.sql"]
